<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan Portfolio QR Code | Hiren Prajapati</title>
  <style>
    body {
      background-color: #07090e;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 2rem;
      text-align: center;
    }
    .qr-card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid #00f2fe;
      box-shadow: 0 0 35px rgba(0, 242, 254, 0.3);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      max-width: 440px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }
    .qr-img {
      width: 260px;
      height: 260px;
      background: #ffffff;
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 1.75rem;
      margin: 0;
      color: #ffffff;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin: 0;
    }
    .url-pill {
      font-family: monospace;
      font-size: 0.85rem;
      color: #00f2fe;
      background: rgba(0, 242, 254, 0.1);
      border: 1px solid rgba(0, 242, 254, 0.3);
      padding: 0.5rem 1.25rem;
      border-radius: 999px;
      word-break: break-all;
    }
    .instructions {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

  <div class="qr-card">
    <img class="qr-img" src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https%3A%2F%2Fprajapatihiren904-svg.github.io%2Fhiren-portfolio2%2F&color=000000&bkgd=ffffff" alt="Hiren Prajapati Portfolio QR Code" />
    
    <div>
      <h1>Hiren Prajapati</h1>
      <p style="margin-top: 0.25rem;">B.Tech AI & Data Science · LJKU</p>
    </div>

    <div class="url-pill">
      https://prajapatihiren904-svg.github.io/hiren-portfolio2/
    </div>

    <div class="instructions">
      📷 Scan with any Phone Camera app to open full 3D animated portfolio
    </div>
  </div>

</body>
</html>
